---
# Metro DR on top of IBM Fusion Access for SAN.
#
# Same DR layer as a regular metro-dr deployment (Multicluster Orchestrator, Ramen,
# DRPolicy, S3 metadata store), with the Ceph specific steps skipped:
#   - no MirrorPeer, volume replication happens at the SAN layer
#   - no DRCluster fencing, there is no Ceph cluster to fence
#
# Layer this on top of conf/ocsci/multicluster_mode_mdr.yaml, or use it on its own
# since it carries the same MULTICLUSTER settings.
MULTICLUSTER:
  multicluster_mode: "metro-dr"
DEPLOYMENT:
  fusion_access: true
ENV_DATA:
  dr_metadata_store: "awss3"
  # Metro DR is a single stretched L2 domain, there is no cross cluster
  # service discovery to set up.
  skip_submariner_deployment: true
  # The managed clusters have to be known to the hub before the DR operators.
  # Set skip_acm_import: true when they were imported out of band.
  import_clusters_to_acm: true
  # Ramen metadata store. One AWS bucket '<dr_s3_bucket_prefix>-<cluster name>'
  # per managed cluster, since there is no NooBaa to provision them.
  dr_s3_region: "us-east-1"
  dr_s3_bucket_prefix: "dnd"
