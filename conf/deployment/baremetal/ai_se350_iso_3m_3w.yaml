---
# Assisted Installer deployment on Lenovo SE350 baremetal using discovery ISO
# via Redfish VirtualMedia (no iPXE / DHCP helper required for discovery boot).
#
# Fill REPLACE_ME values (or overlay them from a private/auth conf) before use.
# Do not commit real BMC passwords or lab IPs if this file is shared publicly.
DEPLOYMENT:
  allow_lower_instance_requirements: false
  local_storage: true
ENV_DATA:
  platform: 'baremetal'
  deployment_type: 'ai'
  worker_replicas: 3
  master_replicas: 3
  # Cluster networking — replace with lab values
  base_domain: 'qe.rh-ocs.com'
  api_vip: '10.48.116.49'
  ingress_vip: '10.48.116.50'
  baremetal:
    # iso = Redfish VirtualMedia discovery ISO (SE350)
    # ipxe = existing helper-node PXE/iPXE path (IBM Cloud Classic / legacy BM)
    boot_method: 'iso'
    # Temporary interactive pauses (Enter to continue, Ctrl+C to abort).
    # Set to false / remove once the SE350 ISO flow is stable.
    manual_checkpoints: true
    env_name: 'se350-lab'
    # Used for MAC -> hostname/role mapping in Assisted Installer
    bm_provisioning_network: 'public'
    redfish_max_workers: 6
    # Optional: skip disks cleanup after install
    # skip_disks_cleanup is under ENV_DATA root if used elsewhere
    servers:
      se350-master-0-farm2:
        role: 'master'
        mgmt_provider: 'redfish'
        mgmt_console: '10.48.115.145'  # XCC BMC IP
        mgmt_username: 'USERID'
        mgmt_password: 'REPLACE_ME'
        public_mac: '04:7b:cb:8c:37:d0'
      se350-master-1-farm2:
        role: 'master'
        mgmt_provider: 'redfish'
        mgmt_console: '10.48.115.146'
        mgmt_username: 'USERID'
        mgmt_password: 'REPLACE_ME'
        public_mac: '04:7b:cb:8c:3b:96'
      se350-master-2-farm2:
        role: 'master'
        mgmt_provider: 'redfish'
        mgmt_console: '10.48.115.147'
        mgmt_username: 'USERID'
        mgmt_password: 'REPLACE_ME'
        public_mac: '04:7b:cb:8c:40:58'
      se350-worker-0-farm2:
        role: 'worker'
        mgmt_provider: 'redfish'
        mgmt_console: '10.48.115.149'
        mgmt_username: 'USERID'
        mgmt_password: 'REPLACE_ME'
        public_mac: '04:7b:cb:fe:bd:ab'
      se350-worker-1-farm2:
        role: 'worker'
        mgmt_provider: 'redfish'
        mgmt_console: '10.48.115.150'
        mgmt_username: 'USERID'
        mgmt_password: 'REPLACE_ME'
        public_mac: '04:7b:cb:fe:bd:26'
      se350-worker-2-farm2:
        role: 'worker'
        mgmt_provider: 'redfish'
        mgmt_console: '10.48.115.155'
        mgmt_username: 'USERID'
        mgmt_password: 'REPLACE_ME'
        public_mac: '04:7b:cb:fe:ee:5e'
