# Example configuration for Two-Node Failover (TNF) baremetal deployment
# This file demonstrates how to configure ocs-ci for TNF deployment

---
DEPLOYMENT:
  installer_version: "4.22"
  force_download_installer: true
  ssh_key: "~/.ssh/id_rsa.pub"
  ssh_key_private: "~/.ssh/id_rsa"

ENV_DATA:
  platform: baremetal
  deployment_type: tnf
  cluster_name: "tnf-cluster-01"
  cluster_path: "/tmp/tnf-cluster-01"
  base_domain: "example.com"
  worker_replicas: 0  # No separate workers for two-node
  master_replicas: 2  # Two control plane nodes

  # Pull secret location
  pull_secret_path: "~/.openshift/pull-secret.json"

  # Network configuration
  cluster_network_cidr: "10.128.0.0/14"
  service_network_cidr: "172.30.0.0/16"
  machine_network_cidr: "192.168.1.0/24"
  network_type: "OVNKubernetes"

  # TNF-specific configuration
  tnf:
    # DRBD utilities image (optional - defaults to latest)
    # drbd_utils_image: "registry.redhat.io/odf4/odf-drbd-rhel9:v4.22"

    # OSD device mappings
    # Specify disk paths using disk-by-id for stability across reboots
    osd_device_mappings:
      - node_name: master-0
        device_path: /dev/disk/by-id/wwn-0x58ce38ee2311e971
        size: 500Gi
        pv_name: local-pv-1

      - node_name: master-1
        device_path: /dev/disk/by-id/wwn-0x58ce38ee2311e972
        size: 500Gi
        pv_name: local-pv-2

    # Monitor disk paths for DRBD (floating monitor)
    # Use disk-by-id paths, not /dev/sdX
    monitor_disk_node_0: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1-0-0-0
    monitor_disk_node_1: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1-0-0-1

  # Baremetal specific configuration
  baremetal:
    bm_status_check: false  # Set to URL if using BM status tracking

    # Server definitions
    servers:
      - name: master-0
        role: master
        bmc_address: ipmi://192.168.1.10
        bmc_username: admin
        bmc_password: password
        boot_mac: "aa:bb:cc:dd:ee:01"
        root_device: /dev/sda
        interface_name: ens192
        ip: 192.168.1.20
        prefix_length: 24
        gateway: 192.168.1.1
        dns_servers:
          - 192.168.1.1
          - 8.8.8.8
        disable_cert_verification: true

      - name: master-1
        role: master
        bmc_address: ipmi://192.168.1.11
        bmc_username: admin
        bmc_password: password
        boot_mac: "aa:bb:cc:dd:ee:02"
        root_device: /dev/sda
        interface_name: ens192
        ip: 192.168.1.21
        prefix_length: 24
        gateway: 192.168.1.1
        dns_servers:
          - 192.168.1.1
          - 8.8.8.8
        disable_cert_verification: true

# OCS/ODF configuration
STORAGE:
  ocs_version: "4.22"

# Reporting
REPORTING:
  collect_logs_on_success: false
  rp_client_log_level: "ERROR"
