# IBM Cloud IPI deployment configuration with region forced to us-south. This
# config is useful for Provider mode deployments with external client clusters,
# placing the client cluster as close to the Provider Cluster as possible.
---
DEPLOYMENT:
  allow_lower_instance_requirements: false
ENV_DATA:
  platform: 'ibm_cloud'
  deployment_type: 'ipi'
  region: 'us-south'
  base_domain: 'ibmcloud2.qe.rh-ocs.com'
  worker_instance_type: 'bxf-16x64'
  master_instance_type: 'bxf-4x16'
  enable_region_dynamic_switching: false
  worker_availability_zones:
    - 'us-south-1'
    - 'us-south-2'
    - 'us-south-3'
  master_availability_zones:
    - 'us-south-1'
    - 'us-south-2'
    - 'us-south-3'
  worker_replicas: 3
  master_replicas: 3

# The following values need to be set in a separate config and passed to ocs-ci in
# order to deploy OCP/OCS cluster on IBM Cloud using IPI.
#
#AUTH:
#  ibmcloud:
#    account_id: ACCOUNT ID PLACEHOLDER
#    api_key: IBM CLOUD API KEY PLACEHOLDER
