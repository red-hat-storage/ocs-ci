---
# Config file for OCP GA 4.16
RUN:
  client_version: '4.16-ga'
DEPLOYMENT:
  ocp_url_template: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{version}/{file_name}-{os_type}-{version}.tar.gz"
  installer_version: "4.16-ga"
  terraform_version: "1.0.11"
  ignition_version: "3.2.0"
  # stable-4.16 is capped at 4.16.55 since 4.16 is EUS-only now; that build
  # predates the RHCOS kernel fix (KCS 7077108, needs >=4.16.65) for the
  # cephx aes256k CSI key cipher, so kernel-client PV mounts fail cluster-wide.
  # Use eus-4.16 instead to pick up a kernel that supports it.
  ocp_channel: "eus"
ENV_DATA:
  vm_template: "rhcos-4.16.0-x86_64-vmware.x86_64"
  acm_hub_channel: release-2.12
  acm_version: "2.12"
  submariner_version: "0.19.0"
