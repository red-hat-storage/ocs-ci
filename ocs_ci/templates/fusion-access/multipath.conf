# Managed by ocs-ci, written to /etc/multipath.conf by the Fusion Access for
# SAN deployment.
#
# user_friendly_names is off on purpose, and it is the only thing this file
# really has to say. mpathX aliases are handed out in discovery order, so the
# same volume ends up with a different name on every node and on every cluster,
# whereas the array presents one WWID for a volume at both sites. Naming by
# WWID is therefore the only scheme under which one name means one LUN across
# all the workers of both clusters, which is what the LocalDisk CRs and the
# Scale NSD labels are keyed on.
#
# Nothing else is set deliberately. device-mapper-multipath already ships a
# built-in profile for the IBM 2145 product id that the Storwize and
# FlashSystem arrays report (see 'multipath -t'), covering path grouping, alua
# prio, failback and retries. Restating those here would only create a second
# copy to keep in step with whatever the array firmware wants next.
defaults {
	user_friendly_names no
}
