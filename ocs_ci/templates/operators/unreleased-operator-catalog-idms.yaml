---
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: #IDMS_NAME_PLACEHOLDER
spec:
  imageDigestMirrors:
  # Simplified IDMS - mirrors all images from registry.redhat.io to registry.stage.redhat.io
  - mirrors:
    - registry.stage.redhat.io
    source: registry.redhat.io
