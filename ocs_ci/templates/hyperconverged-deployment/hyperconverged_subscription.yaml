apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: community-kubevirt-hyperconverged
  namespace: kubevirt-hyperconverged
spec:
  # Channel is set in ocs_ci.deployment.hyperconverged.create_subscription
  # OCP 4.x: candidate-v<x.y> where HCO = OCP - 3.4 (e.g. 4.18 -> candidate-v1.14)
  # OCP 5.x: stable-vX.Y for latest stable HCO (e.g. 1.18.1 -> stable-v1.18)
  channel: ''
  installPlanApproval: Automatic
  name: community-kubevirt-hyperconverged
  source: hyperconverged-catalogsource
  sourceNamespace: openshift-marketplace
