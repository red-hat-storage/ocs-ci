# Minimal alerts profile for OCS-CI Krkn runs.
#
# Newer Krkn enables resiliency scoring when Prometheus is reachable (typical on
# OpenShift). It loads performance_monitoring.alert_profile (default config/alerts.yaml)
# relative to the Krkn process working directory (the Krkn clone root).
#
# KrknConfigGenerator always copies this file to data/krkn/config/alerts.yaml and
# KrKnRunner sets cwd to that clone. Replace with upstream defaults if full SLO
# coverage is needed:
# https://github.com/krkn-chaos/krkn/blob/main/config/alerts.yaml
#
# vector(0) never fires. Do not use absent(up{job="..."}) — that expression
# fires whenever the placeholder job is missing, which is always.

- expr: vector(0)
  description: OCS-CI bundled alerts placeholder (never fires)
  severity: info
